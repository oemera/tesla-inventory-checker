name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scraper -p 'test_*.py'
      - run: docker compose -p tesla-ci -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from integration
      - if: always()
        run: docker compose -p tesla-ci -f compose.test.yaml down --volumes
